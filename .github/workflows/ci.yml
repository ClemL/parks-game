name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    # Table mode's compare-and-set is a Lua script, and the only way to know it
    # holds under two writers is to run it on a real Redis.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The deployment build runs with VERCEL set and, on a fresh project, no
      # Redis credentials. Table mode switches itself off there; the build must
      # not notice.
      - name: Build as a deployment with no Redis store
        run: npm run build
        env:
          VERCEL: '1'
      - run: npm test

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
